name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Extra Python versions run on ubuntu only - no OS-specific Python code.
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "ruff==0.16.0" "mypy==2.3.0" ".[test]"
      - run: ruff check src tests tools
      - run: mypy --strict src
      - run: pytest tests -v --ignore=tests/test_boot_integration.py

  ovmf-integration:
    # Boot the committed fixture .efi apps under Ubuntu's OVMF in real QEMU:
    # app output, a CPU exception disassembled, and two kinds of load failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - run: qemu-system-x86_64 --version && ls -la /usr/share/OVMF/
      - run: pip install ".[test]"
      - run: pytest tests/test_boot_integration.py tests/test_fv.py -v
