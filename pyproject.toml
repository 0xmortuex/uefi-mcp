[project]
name = "uefi-mcp"
version = "0.1.0"
description = "MCP server for UEFI/EDK2/OVMF work: boot an .efi under OVMF and explain the outcome, decode OVMF logs, EFI_STATUS and GUIDs, inspect PE/COFF images and firmware volumes."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0", "pefile>=2023.2.7", "capstone>=5.0"]
keywords = ["mcp", "uefi", "edk2", "ovmf", "firmware", "bootloader", "osdev", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Boot",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/uefi-mcp"

[project.scripts]
uefi-mcp = "uefi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uefi_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
# capstone and pefile ship no type stubs or py.typed marker.
module = ["capstone", "pefile"]
ignore_missing_imports = true
